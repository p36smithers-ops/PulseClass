name: Validate PulseClass

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pulseclass-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: TypeScript check
        working-directory: mobile
        run: npm run typecheck
      - name: Check teacher website JavaScript syntax
        run: node -e "const fs=require('node:fs'); const html=fs.readFileSync('app/index.html','utf8'); const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)]; if(!scripts.length) throw new Error('No inline script found'); for (const script of scripts) new Function(script[1]);"
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check student Edge Function
        run: deno check supabase/functions/student-access/index.ts
      - name: Commit generated dependency lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          git reset --mixed origin/main
          if [ -n "$(git status --porcelain -- mobile/package-lock.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add mobile/package-lock.json
            git commit -m 'chore: lock mobile dependencies [skip ci]'
            git push origin HEAD:main
          fi
