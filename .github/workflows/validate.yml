name: Validate PulseClass

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write


jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: TypeScript check
        working-directory: mobile
        run: npm run typecheck
      - name: Check teacher website JavaScript syntax
        run: node -e "const fs=require('node:fs'); const html=fs.readFileSync('app/index.html','utf8'); const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)]; if(!scripts.length) throw new Error('No inline script found'); for (const script of scripts) new Function(script[1]);"
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check student Edge Function
        run: deno check supabase/functions/student-access/index.ts
      - name: Commit generated dependency lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          git reset --mixed origin/main
          if [ -n "$(git status --porcelain -- mobile/package-lock.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add mobile/package-lock.json
            git commit -m 'chore: lock mobile dependencies [skip ci]'
            git push origin HEAD:main
          fi
  database-proposal-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulseclass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pulseclass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create disposable audited-schema fixture
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d pulseclass_test -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/audited_live_schema.sql
      - name: Apply proposed per-lesson schema to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d pulseclass_test -v ON_ERROR_STOP=1 -f supabase/proposals/002_secure_per_lesson_students.sql
      - name: Test token throttling, reading integrity, RLS and lesson revocation
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d pulseclass_test -v ON_ERROR_STOP=1 -f supabase/tests/per_lesson_students.sql
      - name: Apply six-digit join-code proposal to disposable database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d pulseclass_test -v ON_ERROR_STOP=1 -f supabase/proposals/003_six_digit_join_codes.sql
          psql -h 127.0.0.1 -U postgres -d pulseclass_test -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF EXISTS (SELECT 1 FROM public.classes WHERE join_code !~ '^[0-9]{6}$') THEN RAISE EXCEPTION 'Class join code is not exactly six digits'; END IF; END \$\$;"
