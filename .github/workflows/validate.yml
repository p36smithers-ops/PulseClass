name: Validate PulseClass

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install
      - name: TypeScript check
        working-directory: mobile
        run: npm run typecheck
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check student Edge Function
        run: deno check supabase/functions/student-access/index.ts
      - name: Commit generated dependency lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- mobile/package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add mobile/package-lock.json
            git commit -m 'chore: lock mobile dependencies [skip ci]'
            git push
          fi
